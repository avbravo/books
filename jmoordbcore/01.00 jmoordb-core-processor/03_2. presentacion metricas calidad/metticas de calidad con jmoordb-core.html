- Idoneidad: proporciona las funciones correspondientes

- Precisión: correcta (necesidades del usuario)

- Interoperabilidad: la capacidad de intercambiar datos entre productos.

- Confidencialidad y seguridad: permitir que los usuarios y sistemas autorizados accedan normalmente a los datos y la información correspondientes, y prohibir que los usuarios no autorizados accedan ...

- Cumplimiento funcional: cumplimiento estándar internacional / nacional / industrial / empresarial
]

.left-column[

Confiabilidad
]
.right-column[

- **Madurez**:  
    Permite medir la frecuencia de falla por errores en el SW.

- **Recuperación**:  
    Se refiere a la capacidad de restablecer el nivel de operación y recobrar los datos que hayan sido afectados directamente por una falla, así como al tiempo y el esfuerzo necesario para lograrlo.

- **Tolerancia de fallos**:  
    Se refiere a la habilidad de mantener un nivel específico de funcionamiento en caso de fallas del SW o de cometer infracciones de su interfaz específica.
]
???

notas

---


.left-column[

Usabilidad
]
.right-column[

- **Comprensión**:  
  Se refiere al esfuerzo requerido por los usuarios para reconocer la estructura lógica del sistema y los conceptos relativos a la aplicación del SW.

- **Facilidad de Aprender**:  
    Establece atributos del SW relativos al esfuerzo que los usuarios deben hacer para aprender a usar la aplicación.

- **Operatividad**:  
    Agrupa los conceptos que evalúan la operación y el control del sistema.

]
???

notas

.left-column[

Eficiencia
]
.right-column[

- **Comportamiento en el tiempo:**:  
  Atributos del SW relativos a los tiempos de respuesta y de procedimiento de los datos.

- **Comportamiento de recursos**:  
   Atributos de SW relativos a la cantidad de recursos usados y la duración de su uso en la realización de sus funciones.


]
???

notas

.left-column[

Mantenibilidad
]
.right-column[

- **Estabilidad:**:  
  Capacidad del SW de tener un desempeño normal a pesar de hacerse modificaciones.

- **Facilidad de análisis**:  
   Relativo al esfuerzo necesario para diagnosticar las deficiencias o causas de fallas, o para identificar las partes que deberán ser modificadas.

- **Facilidad de cambios**:  
  Capacidad del que tiene el SW para que la modificación pueda ser válida.

- **Facilidad de pruebas**:  
  Capacidad del que tiene el SW para que la modificación pueda ser válida.



]
???

notas

.left-column[

Portabilidad
]
.right-column[

- **Adaptabilidad:**:  
  Evalúa la oportunidad para adaptar el SW a diferentes ambientes sin  necesidad de aplicarle modificaciones.

- **Facilidad de instalación**:  
   Es el esfuerzo necesario para instalar el SW en un      ambiente determinado.  

- **Cumplimiento**:  
  Permite evaluar si el SW de adhiere a estándares o convenciones     relativas a portabilidad.  

- **Capacidad de reemplazo**:  
  Se refiere a la oportunidad y el esfuerzo usando en       sustituir el SW por otro producto con funciones similares.



]
